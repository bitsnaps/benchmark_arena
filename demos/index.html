<style>
:root {
  --bg: #070b16;
  --bg-elev: #0d1426;
  --surface: #121a30;
  --surface-2: #182240;
  --surface-3: #1e2b4f;
  --line: #27345a;
  --line-2: #354675;
  --text: #e9eefc;
  --muted: #8b9bb8;
  --faint: #5d6d8f;
  --teal: #2ee6c7;
  --teal-dim: rgba(46, 230, 199, 0.14);
  --indigo: #8b9cff;
  --indigo-dim: rgba(139, 156, 255, 0.16);
  --gold: #f5c15a;
  --gold-dim: rgba(245, 193, 90, 0.14);
  --rose: #ff7a93;
  --rose-dim: rgba(255, 122, 147, 0.14);
  --green: #3ee0a0;
  --orange: #ff9f6b;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
  min-height: 100vh;
}
#app { min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3, h4, .brand-word, .display {
  font-family: Outfit, "IBM Plex Sans", sans-serif;
  letter-spacing: -0.03em;
}
.mono, td.num, .num, .tick { font-family: "IBM Plex Mono", ui-monospace, monospace; }
a { color: var(--teal); }
a:hover { color: #7ff3df; }

.lab-nav {
  background: rgba(7, 11, 22, 0.86) !important;
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  min-height: 4rem;
}
.lab-nav .navbar-item, .lab-nav .navbar-link { color: var(--text) !important; }
.lab-nav .navbar-item:hover, .lab-nav .navbar-link:hover,
.lab-nav .navbar-item.router-link-active {
  background: var(--teal-dim) !important;
  color: var(--teal) !important;
}
.lab-nav .navbar-burger { color: var(--text); }
.brand-mark {
  width: 34px; height: 34px; display: grid; place-items: center;
  border-radius: 10px; margin-right: 10px;
  background: linear-gradient(135deg, var(--teal), var(--indigo));
  color: #061018; font-weight: 800; font-size: 14px;
}
.brand-word { font-weight: 700; font-size: 1.05rem; }
.brand-word span { color: var(--teal); }
.compare-pill {
  background: var(--gold-dim); color: var(--gold) !important;
  border-radius: 999px; padding: 0.35rem 0.8rem !important;
  font-weight: 600; font-size: 0.85rem;
}

.shell { flex: 1; padding: 5.4rem 0 3rem; }
.wrap { width: min(1240px, calc(100% - 2rem)); margin: 0 auto; }

.hero-lab {
  position: relative; overflow: hidden;
  border: 1px solid var(--line); border-radius: 28px;
  background:
    radial-gradient(900px 280px at 10% -10%, rgba(46,230,199,.18), transparent 50%),
    radial-gradient(700px 240px at 90% 0%, rgba(139,156,255,.18), transparent 46%),
    linear-gradient(180deg, var(--bg-elev), var(--surface));
  padding: 3.2rem 2.4rem 2.4rem;
  box-shadow: var(--shadow);
}
.kicker {
  color: var(--teal); font-size: 0.78rem; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase;
}
.display { font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.05; margin: 0.4rem 0 1rem; }
.lede { color: var(--muted); font-size: 1.08rem; max-width: 46rem; }
.mesh {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.18;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 42px 42px; mask-image: linear-gradient(#000, transparent 80%);
}

.card-lab, .box, .table-wrap, .panel-lab, .stat, .step-card, .model-tile {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.stat { padding: 1.05rem 1.15rem; }
.stat .lbl { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: .08em; }
.stat .val { font-size: 1.55rem; font-weight: 700; margin-top: .15rem; }
.stat .sub { color: var(--faint); font-size: .8rem; }

.section-title { font-size: 1.45rem; margin: 0 0 .35rem; }
.section-sub { color: var(--muted); margin-bottom: 1.1rem; }

.btn {
  border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text);
  border-radius: 12px; padding: .62rem 1rem; cursor: pointer; font-weight: 600;
  transition: .15s ease; display: inline-flex; align-items: center; gap: .45rem;
}
.btn:hover { border-color: var(--teal); color: var(--teal); transform: translateY(-1px); }
.btn.primary { background: linear-gradient(135deg, #19c8ad, #4f6dff); border: 0; color: #061018; }
.btn.primary:hover { color: #061018; filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.tiny { padding: .32rem .6rem; font-size: .78rem; border-radius: 9px; }
.btn.active { background: var(--teal-dim); color: var(--teal); border-color: var(--teal); }
.btn.danger { color: var(--rose); border-color: rgba(255,122,147,.35); }

.field-lab label { display: block; color: var(--muted); font-size: .8rem; margin-bottom: .3rem; font-weight: 600; }
.input-lab, .select-lab, select.input-lab, textarea.input-lab {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 12px; padding: .65rem .8rem;
  outline: none;
}
.input-lab:focus, .select-lab:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
select.input-lab option { background: var(--surface); }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
  border-radius: 999px; padding: .28rem .7rem; font-size: .78rem; cursor: pointer; font-weight: 600;
}
.chip.on, .chip:hover { color: var(--teal); border-color: var(--teal); background: var(--teal-dim); }

.tag-lab {
  display: inline-flex; align-items: center; gap: .3rem;
  border-radius: 999px; padding: .18rem .55rem; font-size: .72rem; font-weight: 700;
  background: var(--surface-3); color: var(--muted); border: 1px solid var(--line);
}
.tag-lab.teal { background: var(--teal-dim); color: var(--teal); border-color: transparent; }
.tag-lab.gold { background: var(--gold-dim); color: var(--gold); border-color: transparent; }
.tag-lab.indigo { background: var(--indigo-dim); color: var(--indigo); border-color: transparent; }
.tag-lab.rose { background: var(--rose-dim); color: var(--rose); border-color: transparent; }

.table-wrap { overflow: auto; }
table.lab {
  width: 100%; border-collapse: collapse; font-size: .9rem;
}
table.lab th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-2); color: var(--muted); font-size: .72rem;
  letter-spacing: .06em; text-transform: uppercase; text-align: left;
  padding: .8rem .7rem; cursor: pointer; white-space: nowrap; user-select: none;
}
table.lab td { padding: .72rem .7rem; border-top: 1px solid var(--line); vertical-align: middle; }
table.lab tr { cursor: pointer; }
table.lab tbody tr:hover { background: rgba(46,230,199,.05); }
table.lab .num { text-align: right; white-space: nowrap; }
.model-cell { display: flex; align-items: center; gap: .7rem; }
.av {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 800; font-size: .78rem; color: #061018; flex: none;
}
.bar {
  height: 8px; background: #0b1224; border-radius: 99px; overflow: hidden; min-width: 72px;
}
.bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--indigo), var(--teal)); }
.rank {
  width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px;
  background: var(--surface-3); color: var(--muted); font-weight: 700; font-size: .8rem;
}
.rank.g { background: linear-gradient(135deg, #f5c15a, #f97316); color: #2a1600; }
.rank.s { background: linear-gradient(135deg, #d0d7e8, #8b9bb8); color: #1a2233; }
.rank.b { background: linear-gradient(135deg, #d97757, #9a5b3c); color: #2a1208; }

.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.row { display: flex; gap: .7rem; flex-wrap: wrap; align-items: center; }
.mt { margin-top: 1.6rem; }
.mt-sm { margin-top: .8rem; }

.model-tile { padding: 1.1rem; transition: .15s ease; }
.model-tile:hover { transform: translateY(-3px); border-color: var(--line-2); }
.tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; }
.score-xl { font-size: 1.8rem; font-weight: 800; color: var(--teal); }

.tabs-lab { display: flex; gap: .35rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .6rem; margin-bottom: 1rem; }
.tabs-lab button { background: none; border: 0; color: var(--muted); padding: .45rem .75rem; cursor: pointer; font-weight: 600; border-radius: 9px; }
.tabs-lab button.on { background: var(--teal-dim); color: var(--teal); }

.hbar { display: grid; grid-template-columns: 180px 1fr 64px; gap: .7rem; align-items: center; margin: .45rem 0; }
.hbar .name { font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { height: 12px; background: #0b1224; border-radius: 99px; overflow: hidden; }
.track > i { display: block; height: 100%; border-radius: 99px; }

.scatter { width: 100%; height: 460px; background: radial-gradient(circle at 30% 20%, rgba(139,156,255,.08), transparent 40%), var(--bg); border-radius: 14px; border: 1px solid var(--line); }
.tooltip {
  position: fixed; z-index: 50; pointer-events: none;
  background: #0b1224; border: 1px solid var(--line-2); color: var(--text);
  padding: .5rem .7rem; border-radius: 10px; font-size: .8rem; box-shadow: var(--shadow);
}

.step-card { padding: 1rem; cursor: pointer; transition: .15s ease; }
.step-card:hover, .step-card.on { border-color: var(--teal); background: linear-gradient(180deg, var(--teal-dim), var(--surface)); }
.wizard-bar { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.wizard-bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--indigo)); }

.compare-grid { display: grid; gap: 1rem; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: .35rem .8rem; font-size: .86rem; padding: .35rem 0; border-bottom: 1px solid var(--line); }
.kv .k { color: var(--muted); }
.winner { color: var(--teal); font-weight: 700; }
.loser { color: var(--faint); }

.footer-lab { border-top: 1px solid var(--line); color: var(--faint); padding: 1.4rem 0 2rem; font-size: .82rem; }
.notice {
  background: var(--gold-dim); border: 1px solid rgba(245,193,90,.25);
  color: #f3d9a0; border-radius: 12px; padding: .8rem 1rem; font-size: .84rem;
}

.weight { display: grid; grid-template-columns: 140px 1fr 36px; gap: .6rem; align-items: center; font-size: .8rem; }
input[type=range] { width: 100%; accent-color: var(--teal); }

.page-head { margin-bottom: 1.2rem; }
.crumb { color: var(--faint); font-size: .8rem; margin-bottom: .35rem; }
.crumb a { color: var(--muted); text-decoration: none; }

@media (max-width: 980px) {
  .grid-4, .grid-3 { grid-template-columns: 1fr 1fr; }
  .hbar { grid-template-columns: 120px 1fr 52px; }
}
@media (max-width: 700px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .hero-lab { padding: 2rem 1.2rem; }
  .hbar { grid-template-columns: 1fr; }
}
</style>

<script>
const { createApp, ref, reactive, computed, watch, onMounted, onUnmounted } = Vue;
const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

const DATA = JSON.parse(document.getElementById("llm-benchmarks").textContent);
const MODELS = DATA.models;
const METRICS = DATA.metrics;
const USE_CASES = DATA.useCases;

const store = reactive({
  compareIds: [],
  weights: Object.fromEntries(METRICS.map(m => [m.key, m.weight])),
  includePrice: 12,
  includeSpeed: 0,
  includeContext: 0,
  providers: [],
  licenses: [],
  query: "",
  toast: ""
});

function toast(msg) {
  store.toast = msg;
  setTimeout(() => { if (store.toast === msg) store.toast = ""; }, 2200);
}

function blendedPrice(m) {
  return m.pricing.input * 0.4 + m.pricing.output * 0.6;
}
function fmtMoney(n) {
  if (n >= 10) return "$" + n.toFixed(2);
  if (n >= 1) return "$" + n.toFixed(2);
  return "$" + n.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
}
function fmtTokens(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1) + "M";
  if (n >= 1000) return Math.round(n / 1000) + "K";
  return String(n);
}
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function avg(arr) { return arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0; }

const metricExtents = {};
METRICS.forEach(metric => {
  const vals = MODELS.map(m => m.benchmarks[metric.key]).filter(v => v != null && v > 0);
  metricExtents[metric.key] = { min: Math.min(...vals), max: Math.max(...vals) };
});
const priceExt = { min: Math.min(...MODELS.map(blendedPrice)), max: Math.max(...MODELS.map(blendedPrice)) };
const speedExt = { min: Math.min(...MODELS.map(m => m.speed.tps)), max: Math.max(...MODELS.map(m => m.speed.tps)) };
const ctxExt = { min: Math.min(...MODELS.map(m => m.contextWindow)), max: Math.max(...MODELS.map(m => m.contextWindow)) };

function normMetric(key, value) {
  if (value == null || value <= 0) return null;
  const { min, max } = metricExtents[key];
  if (max === min) return 50;
  return ((value - min) / (max - min)) * 100;
}
function normPrice(m) {
  const p = Math.log(blendedPrice(m));
  const a = Math.log(priceExt.min), b = Math.log(priceExt.max);
  return (1 - (p - a) / (b - a)) * 100;
}
function normSpeed(m) {
  return ((m.speed.tps - speedExt.min) / (speedExt.max - speedExt.min)) * 100;
}
function normContext(m) {
  const a = Math.log(ctxExt.min), b = Math.log(ctxExt.max);
  return ((Math.log(m.contextWindow) - a) / (b - a)) * 100;
}

function overallScore(m, weights = store.weights) {
  let num = 0, den = 0;
  METRICS.forEach(metric => {
    const w = Number(weights[metric.key] || 0);
    const n = normMetric(metric.key, m.benchmarks[metric.key]);
    if (w > 0 && n != null) { num += n * w; den += w; }
  });
  if (store.includePrice > 0) { num += normPrice(m) * store.includePrice; den += store.includePrice; }
  if (store.includeSpeed > 0) { num += normSpeed(m) * store.includeSpeed; den += store.includeSpeed; }
  if (store.includeContext > 0) { num += normContext(m) * store.includeContext; den += store.includeContext; }
  return den ? num / den : 0;
}
function valueScore(m) {
  const perf = overallScore(m, Object.fromEntries(METRICS.map(x => [x.key, x.weight])));
  return perf * (normPrice(m) / 50);
}
function scoreColor(v) {
  if (v >= 80) return "var(--teal)";
  if (v >= 60) return "var(--indigo)";
  if (v >= 40) return "var(--gold)";
  return "var(--rose)";
}
function providerColor(id) {
  return ({ openai: "#10a37f", anthropic: "#d97757", google: "#4285f4", deepseek: "#6d7cff", meta: "#0668E1", xai: "#cfd3dc", mistral: "#ff7000", alibaba: "#c73b5f" })[id] || "#8b9bb8";
}
function initials(m) { return m.short.replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase(); }
function byId(id) { return MODELS.find(m => m.id === id); }

const rankedOverall = computed(() => [...MODELS].sort((a, b) => overallScore(b) - overallScore(a)));
const laurels = computed(() => {
  const pick = (fn) => [...MODELS].sort((a, b) => fn(b) - fn(a))[0];
  return {
    overall: pick(overallScore),
    value: pick(valueScore),
    coding: pick(m => m.benchmarks.swebench || 0),
    reasoning: pick(m => (m.benchmarks.gpqa || 0) + (m.benchmarks.aime || 0)),
    context: pick(m => m.contextWindow),
    speed: pick(m => m.speed.tps),
    cheap: [...MODELS].sort((a, b) => blendedPrice(a) - blendedPrice(b))[0],
    open: pick(m => m.license === "open-weights" ? overallScore(m) + 1000 : overallScore(m))
  };
});

function toggleCompare(id) {
  const i = store.compareIds.indexOf(id);
  if (i >= 0) store.compareIds.splice(i, 1);
  else if (store.compareIds.length >= 4) toast("Compare up to 4 models");
  else store.compareIds.push(id);
}
function filteredModels() {
  const q = store.query.trim().toLowerCase();
  return MODELS.filter(m => {
    if (q && !(`${m.name} ${m.provider} ${m.short}`.toLowerCase().includes(q))) return false;
    if (store.providers.length && !store.providers.includes(m.providerId)) return false;
    if (store.licenses.length && !store.licenses.includes(m.license)) return false;
    return true;
  });
}

      { id: "mistral", name: "Mistral" }, { id: "alibaba", name: "Alibaba" }
    ];
    function sortBy(k) {
      if (sortKey.value === k) sortDir.value *= -1;
      else { sortKey.value = k; sortDir.value = k === "name" ? 1 : -1; }
    }
    function nvl(v) { return v ? v.toFixed(1) : "—"; }

        if (key === "price") return dir * (blendedPrice(a.model) - blendedPrice(b.model));
        if (key === "context") return dir * (a.model.contextWindow - b.model.contextWindow);
        return dir * ((a.model.benchmarks[key] || 0) - (b.model.benchmarks[key] || 0));
      });
      return list;
    });
    function togProv(id) {
      const i = store.providers.indexOf(id);
      if (i >= 0) store.providers.splice(i, 1); else store.providers.push(id);
    }
    function togLic(id) {
      const i = store.licenses.indexOf(id);
      if (i >= 0) store.licenses.splice(i, 1); else store.licenses.push(id);
    }
    function resetWeights() {
      METRICS.forEach(m => store.weights[m.key] = m.weight);
      store.includePrice = 12; store.includeSpeed = 0; store.includeContext = 0;
    }
    return { store, metrics: METRICS, providers, rows, sortBy, nvl, fmtMoney, blendedPrice, fmtTokens, toggleCompare, resetWeights };
  }
};

        <div class="step-card" :class="{on: form.speed==='slow'}" @click="form.speed='slow'"><h4>Think as long as you want</h4></div>
      </div>
    </div>

    <div v-if="step===2">
      <h3>Hard constraints</h3>
      <div class="grid-2 mt-sm">
        <div class="panel-lab" style="padding:1rem">
          <div class="field-lab"><label>Minimum context window</label>
            <select class="input-lab" v-model.number="form.minContext">
              <option :value="0">No preference</option>
              <option :value="128000">128K+</option>
              <option :value="200000">200K+</option>
              <option :value="1000000">1M+</option>
            </select>
          </div>
          <div class="field-lab mt-sm"><label>Must see images?</label>
            <div class="chips">
              <span class="chip" :class="{on: form.vision===false}" @click="form.vision=false">No</span>
              <span class="chip" :class="{on: form.vision===true}" @click="form.vision=true">Yes, vision required</span>
            </div>
          </div>
        </div>
        <div class="panel-lab" style="padding:1rem">
          <div class="field-lab"><label>Weights / deployment</label>
            <div class="chips">
              <span class="chip" :class="{on: form.open==='any'}" @click="form.open='any'">Any</span>
              <span class="chip" :class="{on: form.open==='open'}" @click="form.open='open'">Open weights only</span>
              <span class="chip" :class="{on: form.open==='api'}" @click="form.open='api'">Hosted API only</span>
            </div>
          </div>
          <div class="field-lab mt-sm"><label>Max blended $ / 1M tokens</label>
            <select class="input-lab" v-model.number="form.maxPrice">
              <option :value="0">No cap</option>
              <option :value="1">Under $1</option>
              <option :value="4">Under $4</option>
              <option :value="12">Under $12</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div v-if="step===3">
      <h3>Your shortlist</h3>
      <p class="section-sub" v-if="!recs.length">Nothing survives those constraints. Loosen price, context or the open-weights filter.</p>
      <div class="grid-3">
        <div class="model-tile" v-for="(r,i) in recs" :key="r.model.id">
          <div class="tile-top">
            <div class="rank" :class="i===0?'g':i===1?'s':'b'">{{ i+1 }}</div>
            <model-avatar :model="r.model"></model-avatar>
          </div>
          <h3 style="margin:.6rem 0 .2rem">{{ r.model.name }}</h3>
          <div class="score-xl num">{{ r.score.toFixed(1) }}</div>
          <div class="tag-lab teal" v-if="i===0">Recommended</div>
          <ul style="padding-left:1.1rem;color:var(--muted);font-size:.86rem">
            <li v-for="why in r.reasons" :key="why">{{ why }}</li>
          </ul>
          <div class="row mt-sm">
            <router-link class="btn tiny primary" :to="'/model/'+r.model.id">Details</router-link>
            <button class="btn tiny" @click="toggleCompare(r.model.id)">Compare</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row mt">
      <button class="btn" v-if="step>0" @click="step--">Back</button>
      <button class="btn primary" v-if="step<3" :disabled="step===0 && !form.use" @click="next">Continue</button>
      <button class="btn" v-if="step===3" @click="step=0">Start over</button>
    </div>
  </div>`,
  setup() {
    const step = ref(0);
    const form = reactive({ use: "", budget: "balanced", speed: "ok", minContext: 0, vision: false, open: "any", maxPrice: 0 });
    function next() { if (step.value < 3) step.value += 1; }
    const recs = computed(() => {
      const use = USE_CASES.find(u => u.id === form.use) || USE_CASES[0];
      const pool = MODELS.filter(m => {
        if (form.vision && !m.modalities.includes("image")) return false;
        if (form.open === "open" && m.license !== "open-weights") return false;
        if (form.open === "api" && m.license !== "proprietary") return false;
        if (form.minContext && m.contextWindow < form.minContext) return false;
        if (form.maxPrice && blendedPrice(m) > form.maxPrice) return false;
        return true;
      });
      return pool.map(m => {
        let score = 0, den = 0;
        const w = { ...use.weights };
        if (form.budget === "cheap") w.price = (w.price || 0) + 24;
        if (form.budget === "quality") { w.aaIndex = (w.aaIndex || 0) + 10; w.arenaElo = (w.arenaElo || 0) + 8; w.price = Math.max(0, (w.price || 0) - 10); }
        if (form.speed === "fast") w.speed = (w.speed || 0) + 18;
        Object.entries(w).forEach(([k, wt]) => {
          let n = 0;
          if (k === "price") n = normPrice(m);
          else if (k === "speed") n = normSpeed(m);
          else if (k === "context") n = normContext(m);
          else n = normMetric(k, m.benchmarks[k]) ?? 0;
          score += n * wt; den += wt;
        });
        score = den ? score / den : 0;
        const reasons = [];
        if ((m.benchmarks.swebench || 0) >= 60 && (use.id === "coding")) reasons.push("Elite SWE-bench — real repo work, not just katas.");
        if ((m.benchmarks.gpqa || 0) >= 70 && (use.id === "reasoning" || use.id === "research")) reasons.push("GPQA Diamond in the serious-reasoner band.");
        if (normPrice(m) >= 75) reasons.push("Blended token price sits in the cheap quartile.");
        if (m.contextWindow >= 1000000) reasons.push("Native million-token context for whole-project dumps.");
        if (m.license === "open-weights") reasons.push("Open weights — fine-tune or self-host if you need to.");
        if (m.modalities.includes("image")) reasons.push("Vision is available on this SKU.");
        if (m.speed.tps >= 120) reasons.push("High tokens/sec for interactive UX.");
        if (!reasons.length) reasons.push("Solid fit after applying your filters and use-case weights.");
        return { model: m, score, reasons: reasons.slice(0, 4) };
      }).sort((a, b) => b.score - a.score).slice(0, 3);
    });
    return { step, form, uses: USE_CASES, next, recs, toggleCompare };
  }
};

const ModelDetail = {
  components: { ModelAvatar, ScoreBar },
  template: `
  <div v-if="m">
    <div class="crumb"><router-link to="/leaderboard">Leaderboard</router-link> / {{ m.name }}</div>
    <div class="hero-lab">
      <div class="row">
        <model-avatar :model="m" :size="56"></model-avatar>
        <div>
          <div class="kicker">{{ m.provider }} · {{ m.released }} · {{ m.license }}</div>
          <h1 class="display" style="font-size:2.3rem">{{ m.name }}</h1>
          <p class="lede">{{ m.notes }}</p>
        </div>
      </div>
      <div class="grid-4 mt">
        <div class="stat"><div class="lbl">Overall</div><div class="val num" style="color:var(--teal)">{{ overallScore(m).toFixed(1) }}</div></div>
        <div class="stat"><div class="lbl">Blended price</div><div class="val num">{{ fmtMoney(blendedPrice(m)) }}</div><div class="sub">{{ fmtMoney(m.pricing.input) }} in / {{ fmtMoney(m.pricing.output) }} out</div></div>
        <div class="stat"><div class="lbl">Context</div><div class="val num">{{ fmtTokens(m.contextWindow) }}</div><div class="sub">max out {{ fmtTokens(m.maxOutput) }}</div></div>
        <div class="stat"><div class="lbl">Speed</div><div class="val num">{{ m.speed.tps }}</div><div class="sub">t/s · TTFT ~ {{ m.speed.ttft }}s</div></div>
      </div>
      <div class="row mt">
        <button class="btn primary" :class="{active: store.compareIds.includes(m.id)}" @click="toggleCompare(m.id)">{{ store.compareIds.includes(m.id) ? 'In compare set' : 'Add to compare' }}</button>
        <router-link class="btn" to="/compare">Go to compare</router-link>
      </div>
    </div>
    <div class="grid-2 mt">
      <div class="panel-lab" style="padding:1.1rem">
        <h3>Benchmarks</h3>
        <div v-for="met in metrics" :key="met.key" class="kv">
          <span class="k">{{ met.label }}</span>
          <span class="num">{{ fmtM(met.key) }}</span>
        </div>
      </div>
      <div class="stack">
        <div class="panel-lab" style="padding:1.1rem">
          <h3>Strengths</h3>
          <ul style="color:var(--muted)"><li v-for="s in m.strengths" :key="s">{{ s }}</li></ul>
          <h3>Watch-outs</h3>
          <ul style="color:var(--muted)"><li v-for="s in m.weaknesses" :key="s">{{ s }}</li></ul>
          <div class="chips mt-sm">
            <span class="tag-lab teal" v-for="mod in m.modalities" :key="mod">{{ mod }}</span>
            <span class="tag-lab gold" v-for="b in m.bestFor" :key="b">{{ b }}</span>
          </div>
        </div>
        <div class="panel-lab" style="padding:1.1rem">
          <h3>Closest alternatives</h3>
          <div class="kv" v-for="a in alts" :key="a.id" style="cursor:pointer" @click="$router.push('/model/'+a.id)">
            <span class="k">{{ a.name }}</span>
            <span>{{ overallScore(a).toFixed(1) }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div v-else class="notice">Unknown model. <router-link to="/leaderboard">Back to leaderboard</router-link></div>`,
  setup() {
    const route = useRoute();
    const m = computed(() => byId(route.params.id));
    function fmtM(key) {
      const v = m.value && m.value.benchmarks[key];
      if (!v) return "—";
      return key === "arenaElo" ? v : v.toFixed(1) + (key === "aaIndex" ? "" : "%");
    }
    const alts = computed(() => {
      if (!m.value) return [];
      const me = overallScore(m.value);
      return [...MODELS].filter(x => x.id !== m.value.id).sort((a, b) => Math.abs(overallScore(a) - me) - Math.abs(overallScore(b) - me)).slice(0, 4);
    });
    return { m, metrics: METRICS, overallScore, fmtMoney, blendedPrice, fmtTokens, store, toggleCompare, fmtM, alts };
  }
};

const Methodology = {
  template: `
  <div>
    <div class="page-head">
      <div class="kicker">How to read this</div>
      <h1 class="section-title">Methodology</h1>
    </div>
    <div class="panel-lab" style="padding:1.3rem">
      <p>{{ data.meta.disclaimer }}</p>
      <h3 class="mt">Composite score</h3>
      <p style="color:var(--muted)">Each published metric is min-max normalized across the models in this file, then combined with editable weights. Optional axes (cheapness, speed, context) can be mixed in from the leaderboard. This is a decision aid, not a moral ranking of labs.</p>
      <h3 class="mt">Blended price</h3>
      <p style="color:var(--muted)">0.4 × input + 0.6 × output USD per million tokens. Value score multiplies overall quality by a log-inverted price term so cheap-and-capable models surface.</p>
      <h3 class="mt">Sources</h3>
      <ul>
        <li v-for="s in data.sources" :key="s.id"><a :href="s.url" target="_blank" rel="noopener">{{ s.name }}</a></li>
      </ul>
      <p style="color:var(--faint)">Snapshot date {{ data.meta.updated }}. Numbers drift — re-check provider cards before you sign a contract.</p>
    </div>
  </div>`,
  setup() { return { data: DATA }; }
};

const routes = [
  { path: "/", component: Home },
  { path: "/leaderboard", component: Leaderboard },
  { path: "/metrics", component: MetricsPage },
  { path: "/pricing", component: Pricing },
  { path: "/compare", component: Compare },
  { path: "/advisor", component: Advisor },
  { path: "/model/:id", component: ModelDetail },
  { path: "/methodology", component: Methodology }
];

const router = createRouter({ history: createWebHashHistory(), routes });

const Root = {
  components: { NavBar },
  template: `
  <div>
    <nav-bar></nav-bar>
    <main class="shell">
      <div class="wrap">
        <router-view></router-view>
        <footer class="footer-lab mt">
          <div class="row" style="justify-content:space-between">
            <span>LLM Decision Lab · Vue 3 + Buefy/Bulma · snapshot {{ data.meta.updated }}</span>
            <span><router-link to="/methodology">Methodology</router-link> · data from embedded JSON</span>
          </div>
        </footer>
      </div>
    </main>
    <div class="tooltip" v-if="store.toast" style="position:fixed;right:18px;bottom:18px;pointer-events:auto">{{ store.toast }}</div>
  </div>`,
  setup() { return { data: DATA, store }; }
};

const app = createApp(Root);
app.use(router);
app.mount("#app");
</script>
</body>
